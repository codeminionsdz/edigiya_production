[package]
name = "nutrition-erp"
version = "0.1.0"
description = "Desktop ERP system for nutrition business"
authors = ["Your Name"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "api-all"] }

[features]
# by default Tauri runs in strict mode where all net requests are denied
# unix: be sure that `linux-protocol-fd` is added in `ifiers`
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
